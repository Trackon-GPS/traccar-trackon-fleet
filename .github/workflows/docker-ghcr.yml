name: Build and Push Docker Image

on:
  push:
    branches: [ video-playback ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/trackon-gps/traccar-trackon-fleet

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build server
        run: ./gradlew assemble --no-daemon --stacktrace

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Web UI is built from upstream traccar-web (API-compatible with this fork).
      # If you serve the UI elsewhere, delete this step and the two web lines in "Stage payload".
      - name: Checkout web
        uses: actions/checkout@v6
        with:
          repository: traccar/traccar-web
          ref: master
          path: traccar-web-src

      - name: Build web
        working-directory: traccar-web-src
        run: npm ci && npm run build

      - name: Stage payload
        shell: bash
        run: |
          mkdir -p out/{conf,lib,schema,templates,web,data,logs}
          mkdir -p out/templates/translations
          cp target/tracker-server.jar out/
          cp target/lib/* out/lib/
          cp schema/* out/schema/
          cp -r templates/* out/templates/
          cp setup/traccar.xml out/conf/
          cp -r traccar-web-src/build/* out/web/
          cp -r traccar-web-src/src/resources/l10n/* out/templates/translations/
          (cd out && zip -q -r "../docker/traccar-other-${GITHUB_SHA}.zip" .)

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.alpine
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true
